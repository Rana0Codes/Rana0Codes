name: Update Activity Telemetry

on:
  schedule:
    - cron: '0 */6 * * *' # Automatically runs every 6 hours
  push:
    branches:
      - main
  workflow_dispatch: # Allows one-click manual refresh in GitHub Actions tab

jobs:
  update-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Activity Telemetry Script
        run: node scripts/update_activity.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity_overview.svg
          if git diff --staged --quiet; then
            echo "Telemetry is already up to date."
          else
            git commit -m "chore(telemetry): auto-update activity overview [skip ci]"
            git push
          fi
